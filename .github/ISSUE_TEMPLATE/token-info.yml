name: 提交 Token 报销信息
description: 分享你所在公司的 AI Token 报销/补贴待遇
labels: ["token-info"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你分享 Token 报销信息！请如实填写，个人敏感信息（如姓名）无需填写。
  - type: dropdown
    id: company
    attributes:
      label: 公司
      description: 从列表中选择你的公司
      options:
        - 请选择公司...
        - 字节跳动
        - TikTok
        - 阿里巴巴
        - 腾讯
        - 百度
        - 华为
        - 美团
        - 京东
        - 小米
        - 网易
        - 快手
        - 小红书
        - 蚂蚁集团
        - 商汤科技
        - 旷视科技
        - OpenAI
        - Google
        - Microsoft
        - Meta
        - Amazon
        - Anthropic
        - 其他
    validations:
      required: true
  - type: input
    id: companyOther
    attributes:
      label: 其他公司名称
      description: 如在上述列表中选择了"其他"，请填写公司全称
      placeholder: 请填写公司名称
    validations:
      required: false
  - type: input
    id: department
    attributes:
      label: 部门/团队
      description: 具体部门或团队名称
      placeholder: 如：AI Lab、基础架构部
    validations:
      required: false
  - type: checkboxes
    id: tokenType
    attributes:
      label: 供应商（可多选）
      options:
        - label: "OpenAI"
          id: OpenAI
        - label: "Anthropic"
          id: Anthropic
        - label: "Google"
          id: Google
        - label: "阿里云（通义千问 Qwen）"
          id: 通义千问 Qwen
        - label: "百度智能云（文心一言 ERNIE）"
          id: 文心一言 ERNIE
        - label: "字节跳动（豆包 Doubao）"
          id: 豆包 Doubao
        - label: "腾讯云（混元 Hunyuan）"
          id: 混元 Hunyuan
        - label: "智谱 AI（GLM / ChatGLM）"
          id: 智谱 GLM
        - label: "DeepSeek"
          id: DeepSeek
        - label: "Moonshot"
          id: Moonshot
        - label: "MiniMax"
          id: MiniMax
        - label: "内部自研"
          id: 内部自研
        - label: "Azure"
          id: Azure
        - label: "AWS"
          id: AWS
        - label: "Cohere"
          id: Cohere
        - label: "其他"
          id: 其他
        - label: "任意（未限制供应商）"
          id: 任意
    validations:
      required: true
  - type: input
    id: tokenTypeOther
    attributes:
      label: 其他供应商
      description: 如在上述列表中未找到，请填写供应商名称
      placeholder: 请填写供应商名称
    validations:
      required: false
  - type: input
    id: quotaAmount
    attributes:
      label: 额度数值
      description: 具体额度数字，或填写"不限/无上限"等描述
      placeholder: 如：200、不限、无上限、500万
    validations:
      required: true
  - type: checkboxes
    id: quotaUnit
    attributes:
      label: 额度单位
      options:
        - label: "$（美元）"
          id: "$"
        - label: "¥（人民币）"
          id: "¥"
        - label: "Token 数量"
          id: "Token"
        - label: "其他"
          id: 其他
    validations:
      required: true
  - type: input
    id: quotaUnitOther
    attributes:
      label: 其他单位
      placeholder: 如：credits、points
    validations:
      required: false
  - type: checkboxes
    id: quotaPeriod
    attributes:
      label: 报销周期
      options:
        - label: "年"
          id: /年
        - label: "月"
          id: /月
        - label: "日"
          id: /日
        - label: "项目（一次性）"
          id: /项目
        - label: "按需（无固定周期）"
          id: 按需
        - label: "无限制"
          id: 无限制
    validations:
      required: true
  - type: checkboxes
    id: reimbursementMethod
    attributes:
      label: 报销方式（可多选）
      options:
        - label: "公司账号直充 / 公司发放 API Key"
          id: 公司账号直充
        - label: "个人垫付后报销"
          id: 个人垫付报销
        - label: "公司统一充值到个人账户"
          id: 充值到个人账户
        - label: "按量计费，公司月末统一结算"
          id: 按量计费结算
        - label: "固定额度发放，不报销超额"
          id: 固定额度
        - label: "公司提供额度截图凭证，自行充值"
          id: 凭证自行充值
        - label: "其他"
          id: 其他
    validations:
      required: true
  - type: input
    id: reimbursementMethodOther
    attributes:
      label: 其他报销方式
      description: 如在上述列表中未找到，请填写具体方式
      placeholder: 请填写报销方式
    validations:
      required: false
  - type: textarea
    id: restrictions
    attributes:
      label: 限制条件
      description: 使用时有哪些限制
      placeholder: 如：仅限工作用途、需审批、仅特定模型可用
    validations:
      required: false
  - type: textarea
    id: note
    attributes:
      label: 备注
      description: 其他补充信息
      placeholder: 如：额度可叠加、季度结算等
    validations:
      required: false
